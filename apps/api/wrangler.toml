name = "project-f-api"
main = "src/app.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
TURSO_DATABASE_URL = ""
TURSO_AUTH_TOKEN = ""
RESEND_API_KEY = ""
AI_API_KEY = ""
SESSION_SECRET = ""

[[d1_databases]]
binding = "DB"
database_name = "project-f-db"
database_id = ""

[[durable_objects.bindings]]
name = "DO_NOTIFICATION_HUB"
class_name = "NotificationHub"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "project-f-images"

[[migrations]]
tag = "v1"
new_classes = ["NotificationHub"]